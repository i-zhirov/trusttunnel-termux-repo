name: publish

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: publish-termux-repo
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'i-zhirov/trusttunnel-termux-repo' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true
      - name: Build the tools image
        run: docker build --target tools -t termux-repo-tools:local .
      - name: Generate and publish the repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TERMUX_REPO_GPG_PRIVATE_KEY: ${{ secrets.TERMUX_REPO_GPG_PRIVATE_KEY }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            --env GITHUB_TOKEN \
            --env GITHUB_REPOSITORY \
            --env TERMUX_REPO_GPG_PRIVATE_KEY \
            termux-repo-tools:local \
            sh -c '
            set -e
            if [ -z "$TERMUX_REPO_GPG_PRIVATE_KEY" ]; then
              echo "TERMUX_REPO_GPG_PRIVATE_KEY is empty" >&2
              exit 1
            fi
            export GNUPGHOME=/tmp/gnupg
            mkdir -m 700 "$GNUPGHOME"
            printf "%s" "$TERMUX_REPO_GPG_PRIVATE_KEY" | gpg --batch --import
            node scripts/build-repo.js --root /work --site /work/site --publish --sign
            '
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Detect a versions.json change
        id: versions
        run: |
          if git diff --quiet -- versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the version record
        if: steps.versions.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore: bump Termux package versions"
          git push origin master
      - name: Dispatch the test workflow
        if: steps.versions.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref master
